<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6b35">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout Plan</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  body {
    background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 50%, #16213e 100%);
    min-height: 100vh;
    color: #fff;
    padding: 20px;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 40px 20px;
    margin-bottom: 40px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(10px);
  }

  .header h1 {
    font-size: 3rem;
    background: linear-gradient(90deg, #ff9a3c, #ffcc33, #ff6b35);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 15px;
    letter-spacing: 2px;
    font-weight: 800;
  }

  .header .subtitle {
    color: #a0a0b8;
    font-size: 1.1rem;
    margin-bottom: 20px;
  }

  .start-badge {
    display: inline-block;
    padding: 10px 25px;
    background: linear-gradient(90deg, #ff6b35, #ff9a3c);
    border-radius: 50px;
    font-weight: 600;
    color: #fff;
    box-shadow: 0 4px 20px rgba(255, 107, 53, 0.4);
  }

  /* Tabs */
  .tabs {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-bottom: 40px;
    flex-wrap: wrap;
  }

  .tab-btn {
    padding: 12px 30px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #a0a0b8;
    border-radius: 50px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 600;
    transition: all 0.3s ease;
  }

  .tab-btn:hover {
    background: rgba(255, 154, 60, 0.1);
    color: #ff9a3c;
    border-color: rgba(255, 154, 60, 0.3);
  }

  .tab-btn.active {
    background: linear-gradient(90deg, #ff6b35, #ff9a3c);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 20px rgba(255, 107, 53, 0.4);
  }

  /* Day Cards */
  .day-card {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 30px;
    backdrop-filter: blur(10px);
    transition: all 0.3s ease;
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .day-card:hover {
    border-color: rgba(255, 154, 60, 0.3);
    transform: translateY(-3px);
  }

  .day-header {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
    padding-bottom: 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .day-icon {
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #ff6b35, #ff9a3c);
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
  }

  .day-title {
    font-size: 1.8rem;
    color: #fff;
    font-weight: 700;
  }

  .day-subtitle {
    color: #a0a0b8;
    font-size: 0.95rem;
    margin-top: 3px;
  }

  /* Table */
  .exercise-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    overflow: hidden;
    border-radius: 12px;
    background: rgba(0, 0, 0, 0.2);
  }

  .exercise-table thead {
    background: linear-gradient(90deg, rgba(255, 107, 53, 0.2), rgba(255, 154, 60, 0.1));
  }

  .exercise-table th {
    padding: 15px;
    text-align: left;
    color: #ffcc33;
    font-weight: 600;
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .exercise-table td {
    padding: 15px;
    color: #e0e0f0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    font-size: 0.95rem;
  }

  .exercise-table tbody tr {
    transition: all 0.2s ease;
  }

  .exercise-table tbody tr:hover {
    background: rgba(255, 154, 60, 0.05);
  }

  .exercise-table tbody tr:last-child td {
    border-bottom: none;
  }

  .exercise-name {
    font-weight: 600;
    color: #fff;
  }

  .exercise-number {
    display: inline-block;
    width: 28px;
    height: 28px;
    background: rgba(255, 154, 60, 0.15);
    color: #ff9a3c;
    border-radius: 50%;
    text-align: center;
    line-height: 28px;
    font-weight: 700;
    font-size: 0.85rem;
    margin-right: 10px;
  }

  .sets-badge, .reps-badge {
    display: inline-block;
    padding: 5px 12px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    font-weight: 600;
    font-size: 0.85rem;
    color: #ffcc33;
  }

  .notes-cell {
    color: #a0a0b8;
    font-style: italic;
    font-size: 0.9rem;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .header h1 { font-size: 2rem; }
    .day-card { padding: 20px; }
    .day-title { font-size: 1.3rem; }
    .day-icon { width: 50px; height: 50px; font-size: 1.5rem; }
    
    .exercise-table, .exercise-table thead, .exercise-table tbody,
    .exercise-table th, .exercise-table td, .exercise-table tr {
      display: block;
    }
    
    .exercise-table thead {
      display: none;
    }
    
    .exercise-table tbody tr {
      margin-bottom: 15px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      padding: 10px;
    }
    
    .exercise-table td {
      padding: 8px 15px;
      text-align: left;
      border: none;
      position: relative;
      padding-left: 45%;
    }
    
    .exercise-table td::before {
      content: attr(data-label);
      position: absolute;
      left: 15px;
      width: 40%;
      color: #ff9a3c;
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
    }
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <h1>💪 WORKOUT PLAN</h1>
    <p class="subtitle">Your complete training program</p>
    <div class="start-badge" id="startDate"></div>
  </div>

  <!-- Tabs -->
  <div class="tabs" id="tabs"></div>

  <!-- Content -->
  <div id="content"></div>
</div>

<script>
  /* ============================================================
     ⚡ البيانات كلها هنا - عدل عليها براحتك ⚡
     ============================================================ */

  const workoutData = {
    startDate: "22/6/2026",
    programs: [
      {
        id: "ppl",
        tabName: "Push / Pull / Legs",
        days: [
          {
            day: "Day 1",
            title: "Pull",
            icon: "🏋️",
            columns: ["Exercise", "Sets", "Reps / Time", "Notes"],
            exercises: [
              ["Lat Pulldown", "3", "8-12", "Focus on the stretch at the top"],
              ["Seated Cable Row OR T-Bar Row", "3", "8-12", "Choose one per session"],
	      ["Hyperextensions (Lower Back)", "3", "12-15", "Weight is optional"],
              ["Reverse Pec Deck Fly (Rear Delts)", "3", "12-15", "Squeeze at the peak contraction"],
              ["Dumbbell Bicep Curls", "3", "8-12", "Controlled negatives"],
              ["Cable Hammer Curls", "2", "10-12", "Keeps constant tension on the brachialis"],
              ["Dumbbell Shrugs (Traps)", "2", "10-12", "Hold for 1 sec at the top"],
              ["Dead Hang", "2", "45 sec", "Stretches"]
            ]
          },
          {
            day: "Day 2",
            title: "Push",
            icon: "💥",
            columns: ["Exercise", "Sets", "Reps / Time", "Notes"],
            exercises: [
              ["Incline Bench Press", "3", "6-10", "Heavy compound movement"],
              ["Chest Fly Machine OR Seated Chest Press", "3", "8-12", "Choose one per session"],
              ["Machine Overhead Press", "2", "8-12", "Focus on shoulder pressing power"],
              ["Dumbbell Lateral Raises", "3", "12-15", "Control the weight, don't swing"],
              ["Triceps Pushdown (Cable)", "3", "10-12", "From top to bottom position"],
              ["Overhead Triceps Extension (Cable)", "2", "10-12", "Great for the long head of the triceps"],
              ["Bicycle Crunches", "3", "15-20", "Standard controlled crunches"],
              ["Doorway Chest Stretch", "2", "30 sec", "Stretches"]
            ]
          },
          {
            day: "Day 3",
            title: "Legs",
            icon: "🦵",
            columns: ["Exercise", "Sets", "Reps / Time", "Notes"],
            exercises: [
              ["Leg Press", "3", "8-12", "Main heavy compound lift of the day"],
	      ["Romanian Deadlift", "2", "8-12", "Lower until you feel a deep stretch in the hamstrings, then drive your hips forward to stand up."],
              ["Leg Extensions (Quad Machine)", "3", "10-12", "Great for isolating the quads"],
              ["Seated/Lying Leg Curls (Hamstring Machine)", "3", "10-12", "Squeeze hard at the bottom"],
              ["Calf Raises (Machine)", "3", "12-15", "Full range of motion (stretch & squeeze)"],
              ["Plank", "3", "30-60 sec", "Keep your core locked"],
              ["Kneeling Hip Flexor Stretch", "1", "45 sec", "Stretches"]
            ]
          }
        ]
      },
      {
        id: "home",
        tabName: "Home Workout",
        days: [
          {
            day: "Day 1",
            title: "Upper Body",
            icon: "🏠",
            columns: ["Exercise", "Sets", "Form & Safety Notes"],
            exercises: [
              ["Push-ups", "3", "Focus on a slow, controlled negative to target the chest."],
              ["Backpack Rows", "3", "Keep your back straight; pull with your elbows, not your hands."],
              ["Backpack Overhead Press", "2", "Core engaged and body rigid to protect the lower back."],
              ["Lateral Raises", "3", "Control the weight on the way down; don't swing your torso."],
              ["Reverse Snow Angels", "3", "Lie on your stomach; hover hands and move them in a wide arc."],
              ["Bench/Chair Dips", "3", "Keep your back close to the bench to isolate the triceps."],
              ["Backpack Hammer Curls", "3", "Keep elbows pinned to your sides; focus on the biceps/brachialis."],
              ["Bicycle Crunches", "3", "Rotate from your core, not your neck; keep lower back flat on the floor."]
            ]
          },
          {
            day: "Day 2",
            title: "Lower Body",
            icon: "🔥",
            columns: ["Exercise", "Sets", "Form & Safety Notes"],
            exercises: [
              ["Weighted Backpack Squats", "3", "Drive through your heels; keep your spine neutral and chest up."],
              ["Backpack Romanian Deadlifts (RDL)", "3", "Hinge at the hips, push glutes back; feel a deep stretch in the hamstrings."],
              ["Weighted Backpack Lunges", "2", "Take a controlled step forward; keep your torso stable."],
              ["Superman Hold", "3", "Hold for 20–30 seconds per set to strengthen the lower back/erectors."],
              ["Backpack Glute Bridges", "2", "Drive your hips up and squeeze your glutes hard at the top for 1 second."],
              ["Backpack Calf Raises", "3", "Pause at the top contraction; control the eccentric phase downward."],
              ["Plank", "3", "Keep a perfectly straight line from head to toe; squeeze your abs and glutes."]
            ]
          },
          {
            day: "Day 3",
            title: "Stretches & Flexibility",
            icon: "🧘",
            columns: ["Stretch", "Duration", "Targets / Execution"],
            exercises: [
              ["Kneeling Quad Stretch", "45 sec / leg", "Pull your back ankle toward your glutes to release the quads."],
              ["Seated Hamstring Stretch", "45 sec", "Sit down, reach forward with a flat back to stretch the hamstrings."],
              ["90/90 Stretch", "45 sec / side", "Opens up tight hips and glutes after lower body day."],
              ["Cobra Pose", "45 sec", "Decompresses the lumbar spine and stretches the abdominals."],
              ["Child's Pose", "45 sec", "Relaxes the entire spine, lats, and shoulders."],
              ["Doorway Chest Stretch", "45 sec", "Opens up tight chest muscles and anterior shoulders from push-ups."],
              ["Cross-Body Shoulder Stretch", "45 sec / arm", "Stretches the lateral and posterior deltoids."]
            ]
          }
        ]
      }
    ]
  };

  /* ============================================================
     🎨 كود العرض - مش محتاج تعدل فيه
     ============================================================ */

  let currentProgramIndex = 0;

  function render() {
    // Render start date
    document.getElementById('startDate').textContent = `📅 Started: ${workoutData.startDate}`;

    // Render tabs
    const tabsContainer = document.getElementById('tabs');
    tabsContainer.innerHTML = '';
    workoutData.programs.forEach((program, index) => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (index === currentProgramIndex ? ' active' : '');
      btn.textContent = program.tabName;
      btn.onclick = () => {
        currentProgramIndex = index;
        render();
      };
      tabsContainer.appendChild(btn);
    });

    // Render content
    const content = document.getElementById('content');
    content.innerHTML = '';
    const program = workoutData.programs[currentProgramIndex];

    program.days.forEach(day => {
      const card = document.createElement('div');
      card.className = 'day-card';

      // Header
      let headerHTML = `
        <div class="day-header">
          <div class="day-icon">${day.icon}</div>
          <div>
            <div class="day-title">${day.day}: ${day.title}</div>
            <div class="day-subtitle">${day.exercises.length} exercises</div>
          </div>
        </div>
      `;

      // Table
      let tableHTML = `
        <table class="exercise-table">
          <thead>
            <tr>
              <th>#</th>
      `;
      day.columns.forEach(col => {
        tableHTML += `<th>${col}</th>`;
      });
      tableHTML += `</tr></thead><tbody>`;

      day.exercises.forEach((ex, i) => {
        tableHTML += `<tr>`;
        tableHTML += `<td data-label="#"><span class="exercise-number">${i + 1}</span></td>`;
        ex.forEach((cell, j) => {
          let className = '';
          if (j === 0) className = 'exercise-name';
          else if (j === 1) className = 'sets-cell';
          else if (j === 2 && day.columns.length === 4) className = 'reps-cell';
          else className = 'notes-cell';

          let cellContent = cell;
          if (j === 1) cellContent = `<span class="sets-badge">${cell}</span>`;
          else if (j === 2 && day.columns.length === 4) cellContent = `<span class="reps-badge">${cell}</span>`;

          tableHTML += `<td data-label="${day.columns[j]}" class="${className}">${cellContent}</td>`;
        });
        tableHTML += `</tr>`;
      });

      tableHTML += `</tbody></table>`;

      card.innerHTML = headerHTML + tableHTML;
      content.appendChild(card);
    });
  }

  // Initial render
  render();
</script>

<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
}
</script>

</body>
</html>
